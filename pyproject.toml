[project]
name = "lastbook-kit"
version = "0.1.0"
description = "Get, check and serve Lastbook libraries without the desktop app or a local AI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.15"
dependencies = [
  # What upstream's server.py needs (its packaging/linux/requirements_linux.txt).
  # lbx itself uses only the standard library.
  "libzim>=3.13,<4",  # 4.0 renamed getResults and getEstimatedMatches, which upstream calls
  "numpy>=2",
  "beautifulsoup4>=4.12",
  "pypdfium2>=5",
]

[project.urls]
Homepage = "https://github.com/jonocodes/lastbook-kit"

[project.scripts]
lbx = "lbx.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lbx"]

[tool.hatch.build.targets.sdist]
include = ["lbx", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["small: needs the real Small library (set LASTBOOK_KIT_DATA)"]
