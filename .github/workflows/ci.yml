name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  uv:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      # The Small-library tests skip here: there's no LASTBOOK_KIT_DATA in CI.
      - run: uv run pytest -ra

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: cachix/install-nix-action@v31
      - run: nix build .#lbx -L
      - run: ./result/bin/lbx --version
